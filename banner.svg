<svg fill="none" viewBox="0 0 800 200" width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          background: linear-gradient(135deg, #020b16 0%, #051937 50%, #000 100%);
          height: 200px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          font-family: 'Segoe UI', serif;
          border: 2px solid #c5a059;
          position: relative;
          overflow: hidden;
        }
        .greek-pattern {
          position: absolute;
          top: 10px;
          bottom: 10px;
          left: 10px;
          right: 10px;
          border: 1px solid rgba(197, 160, 89, 0.3);
          pointer-events: none;
        }
        h1 {
          color: #c5a059;
          font-size: 45px;
          letter-spacing: 8px;
          text-transform: uppercase;
          margin: 0;
          text-shadow: 0 0 20px rgba(197, 160, 89, 0.5);
          font-weight: 900;
        }
        .subtitle {
          color: #8892b0;
          font-size: 14px;
          letter-spacing: 5px;
          margin-top: 10px;
          text-transform: uppercase;
        }
        .glow {
          position: absolute;
          width: 150px;
          height: 150px;
          background: radial-gradient(circle, rgba(197, 160, 89, 0.2) 0%, transparent 70%);
          border-radius: 50%;
          top: 25px;
        }
      </style>
      <div class="container">
        <div class="greek-pattern"></div>
        <div class="glow"></div>
        <h1>GOKULAN ANBALAGAN</h1>
        <div class="subtitle">THE ODYSSEY • MMXXVI</div>
      </div>
    </div>
  </foreignObject>
</svg>
