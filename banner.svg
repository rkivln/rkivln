<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 860 200"
     width="860"
     height="200">

  <defs>

    <!-- ═══════════════════════════════════════
         VICE CITY SKY
    ═══════════════════════════════════════ -->

    <linearGradient id="sky"
                    x1="0"
                    y1="0"
                    x2="0"
                    y2="1">

      <stop offset="0%"
            stop-color="#24134f"/>

      <stop offset="38%"
            stop-color="#7b286f"/>

      <stop offset="72%"
            stop-color="#e75d7c"/>

      <stop offset="100%"
            stop-color="#ffb35c"/>

    </linearGradient>


    <!-- Sunset -->

    <radialGradient id="sun"
                    cx="50%"
                    cy="50%"
                    r="50%">

      <stop offset="0%"
            stop-color="#fff4c4"
            stop-opacity="1"/>

      <stop offset="45%"
            stop-color="#ffd16a"
            stop-opacity=".9"/>

      <stop offset="100%"
            stop-color="#ff6b8a"
            stop-opacity="0"/>

    </radialGradient>


    <!-- Neon Pink -->

    <linearGradient id="pink"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">

      <stop offset="0%"
            stop-color="#ff3cac"/>

      <stop offset="50%"
            stop-color="#ff71c7"/>

      <stop offset="100%"
            stop-color="#ff3cac"/>

    </linearGradient>


    <!-- Cyan -->

    <linearGradient id="cyan"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">

      <stop offset="0%"
            stop-color="#00d9ff"/>

      <stop offset="50%"
            stop-color="#72f7ff"/>

      <stop offset="100%"
            stop-color="#00d9ff"/>

    </linearGradient>


    <!-- Dark foreground -->

    <linearGradient id="ground"
                    x1="0"
                    y1="0"
                    x2="0"
                    y2="1">

      <stop offset="0%"
            stop-color="#151024"/>

      <stop offset="100%"
            stop-color="#05050b"/>

    </linearGradient>


    <!-- Neon glow -->

    <filter id="pinkGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur
          stdDeviation="3"
          result="blur"/>

      <feMerge>

        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>


    <filter id="cyanGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur
          stdDeviation="2"
          result="blur"/>

      <feMerge>

        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>


    <!-- ═══════════════════════════════════════
         ANIMATIONS
    ═══════════════════════════════════════ -->

    <style>

      .sunPulse {
        animation:
        sunPulse 4s ease-in-out infinite;
      }

      .neon {
        animation:
        neon 2s ease-in-out infinite;
      }

      .stars {
        animation:
        stars 2.5s ease-in-out infinite;
      }

      .scan {
        animation:
        scan 4s linear infinite;
      }

      .blink {
        animation:
        blink 1.5s steps(2) infinite;
      }

      .wave {
        animation:
        wave 3s ease-in-out infinite;
      }


      @keyframes sunPulse {

        0%,100% {
          opacity:.75;
        }

        50% {
          opacity:1;
        }

      }


      @keyframes neon {

        0%,100% {
          opacity:.65;
        }

        50% {
          opacity:1;
        }

      }


      @keyframes stars {

        0%,100% {
          opacity:.35;
        }

        50% {
          opacity:1;
        }

      }


      @keyframes scan {

        0% {
          transform:translateX(-200px);
          opacity:0;
        }

        25% {
          opacity:.25;
        }

        100% {
          transform:translateX(900px);
          opacity:0;
        }

      }


      @keyframes blink {

        0%,45% {
          opacity:1;
        }

        50%,100% {
          opacity:.25;
        }

      }


      @keyframes wave {

        0%,100% {
          transform:translateX(0);
        }

        50% {
          transform:translateX(8px);
        }

      }

    </style>

  </defs>


  <!-- ═══════════════════════════════════════
       SKY
  ═══════════════════════════════════════ -->

  <rect width="860"
        height="200"
        rx="14"
        fill="url(#sky)"/>


  <!-- Sunset -->

  <circle cx="215"
          cy="105"
          r="65"
          fill="url(#sun)"
          class="sunPulse"/>

  <circle cx="215"
          cy="105"
          r="27"
          fill="#ffd979"
          opacity=".9"/>


  <!-- ═══════════════════════════════════════
       SUNSET HORIZONTAL LINES
  ═══════════════════════════════════════ -->

  <g stroke="#ffd6a0"
     stroke-width="1"
     opacity=".15">

    <line x1="0" y1="48" x2="430" y2="48"/>
    <line x1="0" y1="55" x2="430" y2="55"/>
    <line x1="0" y1="62" x2="430" y2="62"/>
    <line x1="0" y1="69" x2="430" y2="69"/>
    <line x1="0" y1="76" x2="430" y2="76"/>

  </g>


  <!-- ═══════════════════════════════════════
       DISTANT CITY
  ═══════════════════════════════════════ -->

  <g fill="#281a35"
     opacity=".85">

    <rect x="0"
          y="119"
          width="45"
          height="40"/>

    <rect x="42"
          y="105"
          width="35"
          height="54"/>

    <rect x="73"
          y="128"
          width="42"
          height="31"/>

    <rect x="110"
          y="112"
          width="27"
          height="47"/>

    <rect x="135"
          y="122"
          width="53"
          height="37"/>

    <rect x="183"
          y="108"
          width="34"
          height="51"/>

    <rect x="215"
          y="123"
          width="43"
          height="36"/>

    <rect x="253"
          y="104"
          width="25"
          height="55"/>

    <rect x="276"
          y="115"
          width="47"
          height="44"/>

    <rect x="319"
          y="100"
          width="30"
          height="59"/>

    <rect x="347"
          y="122"
          width="52"
          height="37"/>

    <rect x="395"
          y="110"
          width="35"
          height="49"/>

  </g>


  <!-- Building lights -->

  <g fill="#ffd86b"
     opacity=".45">

    <rect x="50" y="113"
          width="4" height="3"/>

    <rect x="50" y="123"
          width="4" height="3"/>

    <rect x="119" y="119"
          width="4" height="3"/>

    <rect x="145" y="130"
          width="4" height="3"/>

    <rect x="193" y="116"
          width="4" height="3"/>

    <rect x="263" y="113"
          width="4" height="3"/>

    <rect x="329" y="110"
          width="4" height="3"/>

    <rect x="329" y="124"
          width="4" height="3"/>

  </g>


  <!-- ═══════════════════════════════════════
       PALM TREES
  ═══════════════════════════════════════ -->

  <g fill="#100b1d"
     stroke="#100b1d">

    <!-- Left palm -->

    <path d="
      M40 160
      Q52 126 49 96
      Q48 80 43 67"
      fill="none"
      stroke-width="5"/>

    <path d="
      M43 70
      Q22 58 7 61
      Q25 64 43 74

      M44 70
      Q26 47 12 43
      Q30 55 46 73

      M47 69
      Q48 43 59 31
      Q55 53 50 72

      M48 70
      Q67 47 82 45
      Q66 56 51 74

      M47 73
      Q70 66 88 72
      Q68 68 48 77"
      fill="none"
      stroke-width="3"/>


    <!-- Right palm -->

    <path d="
      M410 160
      Q397 125 401 95
      Q403 78 408 65"
      fill="none"
      stroke-width="5"/>

    <path d="
      M408 68
      Q430 54 445 57
      Q427 62 407 73

      M407 68
      Q426 45 440 40
      Q423 54 405 72

      M405 68
      Q404 43 393 31
      Q397 53 403 72

      M405 69
      Q386 46 371 44
      Q387 55 402 73

      M405 72
      Q382 65 364 71
      Q384 68 405 76"
      fill="none"
      stroke-width="3"/>

  </g>


  <!-- ═══════════════════════════════════════
       ROAD
  ═══════════════════════════════════════ -->

  <path
      d="M0 162
         L430 153
         L860 162
         L860 200
         L0 200 Z"
      fill="url(#ground)"/>


  <!-- Neon road edges -->

  <path d="M0 165
           L430 156
           L860 165"
        fill="none"
        stroke="url(#pink)"
        stroke-width="2"
        filter="url(#pinkGlow)"/>


  <path d="M0 175
           L430 167
           L860 175"
        fill="none"
        stroke="url(#cyan)"
        stroke-width="1"
        opacity=".65"/>


  <!-- Road perspective -->

  <g stroke="#ffffff"
     stroke-width="1"
     opacity=".12">

    <line x1="150" y1="200"
          x2="390" y2="157"/>

    <line x1="310" y1="200"
          x2="415" y2="157"/>

    <line x1="550" y1="200"
          x2="445" y2="157"/>

    <line x1="710" y1="200"
          x2="470" y2="157"/>

  </g>


  <!-- ═══════════════════════════════════════
       LEFT PROFILE CARD
  ═══════════════════════════════════════ -->

  <g transform="translate(22,34)">

    <!-- dark card -->

    <rect width="350"
          height="118"
          rx="8"
          fill="#090812"
          opacity=".9"
          stroke="#ff4fae"
          stroke-width="1"/>


    <!-- top pink bar -->

    <rect width="350"
          height="5"
          rx="3"
          fill="url(#pink)"
          filter="url(#pinkGlow)"/>


    <!-- Mission -->

    <text x="18"
          y="27"
          font-family="'Courier New',monospace"
          font-size="8"
          letter-spacing="3"
          fill="#ff67bd">

      MISSION

    </text>


    <text x="18"
          y="57"
          font-family="Arial Black,sans-serif"
          font-size="27"
          font-style="italic"
          letter-spacing="2"
          fill="#ffffff">

      GOKULAN

    </text>


    <text x="19"
          y="75"
          font-family="'Courier New',monospace"
          font-size="8"
          letter-spacing="2"
          fill="#aaa">

      FULL STACK DEVELOPER

    </text>


    <!-- divider -->

    <line x1="18"
          y1="87"
          x2="332"
          y2="87"
          stroke="#333"/>


    <!-- stats -->

    <text x="18"
          y="103"
          font-family="'Courier New',monospace"
          font-size="7"
          fill="#666">

      LEVEL

    </text>

    <text x="52"
          y="103"
          font-family="'Courier New',monospace"
          font-size="8"
          font-weight="bold"
          fill="#ffe067">

      DEVELOPER

    </text>


    <text x="160"
          y="103"
          font-family="'Courier New',monospace"
          font-size="7"
          fill="#666">

      STATUS

    </text>

    <text x="201"
          y="103"
          font-family="'Courier New',monospace"
          font-size="8"
          font-weight="bold"
          fill="#3cffb0">

      ACTIVE

    </text>


    <text x="272"
          y="103"
          font-family="'Courier New',monospace"
          font-size="7"
          fill="#666">

      2026

    </text>

  </g>


  <!-- ═══════════════════════════════════════
       RIGHT — GTA INSPIRED UI
  ═══════════════════════════════════════ -->

  <g transform="translate(395,39)">

    <!-- Main panel -->

    <rect width="438"
          height="122"
          rx="8"
          fill="#090812"
          opacity=".93"
          stroke="#00e5ff"
          stroke-width="1"/>


    <!-- panel accent -->

    <rect x="0"
          y="0"
          width="6"
          height="122"
          rx="3"
          fill="url(#cyan)"
          filter="url(#cyanGlow)"/>


    <!-- Location -->

    <text x="23"
          y="25"
          font-family="'Courier New',monospace"
          font-size="8"
          letter-spacing="3"
          fill="#00e5ff">

      VICE CITY / DEVELOPER HQ

    </text>


    <!-- Main title -->

    <text x="23"
          y="57"
          font-family="Arial Black,sans-serif"
          font-size="24"
          font-style="italic"
          letter-spacing="1"
          fill="#ffffff">

      BUILD SOMETHING

    </text>


    <text x="23"
          y="79"
          font-family="Arial Black,sans-serif"
          font-size="24"
          font-style="italic"
          letter-spacing="1"
          fill="url(#pink)"
          filter="url(#pinkGlow)">

      LEGENDARY.

    </text>


    <!-- Mission progress -->

    <text x="24"
          y="100"
          font-family="'Courier New',monospace"
          font-size="7"
          letter-spacing="2"
          fill="#666">

      MISSION PROGRESS

    </text>


    <rect x="24"
          y="108"
          width="190"
          height="5"
          rx="2"
          fill="#222"/>


    <rect x="24"
          y="108"
          width="145"
          height="5"
          rx="2"
          fill="url(#pink)"
          class="neon"
          filter="url(#pinkGlow)"/>


    <text x="224"
          y="113"
          font-family="'Courier New',monospace"
          font-size="7"
          fill="#aaa">

      76%

    </text>


    <!-- Wanted level -->

    <text x="282"
          y="100"
          font-family="'Courier New',monospace"
          font-size="7"
          letter-spacing="2"
          fill="#666">

      WANTED

    </text>


    <g transform="translate(282,105)"
       class="stars">

      <text x="0"
            y="8"
            font-size="10"
            fill="#ffe000">

        ★ ★ ★

      </text>

      <text x="34"
            y="8"
            font-size="10"
            fill="#333">

        ★ ★

      </text>

    </g>


    <!-- status -->

    <circle cx="406"
            cy="104"
            r="4"
            fill="#39ff88"
            class="blink"/>

  </g>


  <!-- ═══════════════════════════════════════
       SCAN EFFECT
  ═══════════════════════════════════════ -->

  <rect x="-100"
        y="35"
        width="2"
        height="135"
        fill="#ffffff"
        opacity=".2"
        class="scan"/>


  <!-- ═══════════════════════════════════════
       TOP LABEL
  ═══════════════════════════════════════ -->

  <text x="835"
        y="25"
        text-anchor="end"
        font-family="'Courier New',monospace"
        font-size="7"
        letter-spacing="2"
        fill="#ffffff"
        opacity=".6">

    GRAND THEFT DEVELOPER

  </text>


  <!-- ═══════════════════════════════════════
       BOTTOM BAR
  ═══════════════════════════════════════ -->

  <rect x="0"
        y="181"
        width="860"
        height="19"
        fill="#07070b"
        opacity=".95"/>


  <!-- Pink line -->

  <rect x="0"
        y="181"
        width="300"
        height="2"
        fill="#ff3cac"
        filter="url(#pinkGlow)"/>


  <!-- Cyan line -->

  <rect x="560"
        y="181"
        width="300"
        height="2"
        fill="#00e5ff"
        filter="url(#cyanGlow)"/>


  <text x="22"
        y="194"
        font-family="'Courier New',monospace"
        font-size="7"
        letter-spacing="2"
        fill="#777">

    SUNNY PLACE • NIGHT CITY • OPEN WORLD

  </text>


  <text x="835"
        y="194"
        text-anchor="end"
        font-family="'Courier New',monospace"
        font-size="7"
        letter-spacing="1"
        fill="#555">

    GOKULAN // 01 // ONLINE

  </text>


</svg>
