  />


  <!-- ═══════════════════════════════════════
       LEFT PALM TREE
  ═══════════════════════════════════════ -->

  <g
    fill="none"
    stroke="#0B0B16"
    stroke-linecap="round">

    <!-- Trunk -->

    <path
      d="M112 111
         C108 87 108 61 118 42"
      stroke-width="5"/>

    <!-- Leaves -->

    <path
      d="
        M118 44
        C105 34 94 34 83 37

        M118 44
        C106 27 103 20 104 12

