<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 860 140"
     width="860"
     height="140">

  <defs>

    <!-- ═══════════════════════════════════════
         VICE CITY SKY
    ═══════════════════════════════════════ -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#17152F"/>
      <stop offset="52%"  stop-color="#4A1F63"/>
      <stop offset="100%" stop-color="#F04B8A"/>
    </linearGradient>

    <!-- SUN -->
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFF0A6"/>
      <stop offset="100%" stop-color="#FF9A56"/>
    </linearGradient>

    <!-- ROAD -->
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#171827"/>
      <stop offset="100%" stop-color="#070812"/>
    </linearGradient>

    <!-- SUN GLOW -->
    <filter id="softGlow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">

      <feGaussianBlur
        stdDeviation="4"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <!-- TEXT GLOW -->
    <filter id="textGlow"
            x="-50%"
            y="-100%"
            width="200%"
            height="300%">

      <feGaussianBlur
        in="SourceAlpha"
        stdDeviation="2.5"
        result="blur"/>

      <feFlood
        flood-color="#FF3CAC"
        flood-opacity=".65"/>

      <feComposite
        in2="blur"
        operator="in"/>

      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <!-- ═══════════════════════════════════════
         ANIMATIONS
    ═══════════════════════════════════════ -->

    <style>

      .pulse {
        animation:
          pulse 3s ease-in-out infinite;
      }

      .scan {
        animation:
          scan 5s linear infinite;
      }

      @keyframes pulse {

        0%,100% {
          opacity: .65;
        }

        50% {
          opacity: 1;
        }

      }

      @keyframes scan {

        from {
          transform: translateX(-70px);
          opacity: 0;
        }

        15% {
          opacity: .5;
        }

        50% {
          opacity: .9;
        }

        85% {
          opacity: .5;
        }

        to {
          transform: translateX(930px);
          opacity: 0;
        }

      }

    </style>

  </defs>


  <!-- ═══════════════════════════════════════
       BACKGROUND
  ═══════════════════════════════════════ -->

  <rect
    width="860"
    height="140"
    rx="14"
    fill="url(#sky)"
  />


  <!-- ═══════════════════════════════════════
       STARS
  ═══════════════════════════════════════ -->

  <g
    fill="#FFFFFF"
    class="pulse">

    <circle cx="72"  cy="22" r="1"/>
    <circle cx="156" cy="35" r=".8"/>
    <circle cx="244" cy="17" r="1"/>
    <circle cx="335" cy="29" r=".7"/>
    <circle cx="522" cy="18" r=".9"/>
    <circle cx="618" cy="32" r=".7"/>
    <circle cx="735" cy="20" r="1"/>
    <circle cx="802" cy="39" r=".8"/>

  </g>


  <!-- ═══════════════════════════════════════
       SUN
  ═══════════════════════════════════════ -->

  <circle
    cx="430"
    cy="72"
    r="31"
    fill="url(#sun)"
    filter="url(#softGlow)"
  />


  <!-- SUN HORIZONTAL LINES -->

  <g
    stroke="#F04B8A"
    stroke-width="3"
    opacity=".65">

    <line
      x1="401"
      y1="65"
      x2="459"
      y2="65"/>

    <line
      x1="400"
      y1="72"
      x2="460"
      y2="72"/>

    <line
      x1="402"
      y1="79"
      x2="458"
      y2="79"/>

    <line
      x1="406"
      y1="86"
      x2="454"
      y2="86"/>

  </g>


  <!-- ═══════════════════════════════════════
       CITY SKYLINE
  ═══════════════════════════════════════ -->

  <path
