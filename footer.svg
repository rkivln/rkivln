       RIGHT PALM TREE
  ═══════════════════════════════════════ -->

  <g
    fill="none"
    stroke="#0B0B16"
    stroke-linecap="round">

    <!-- Trunk -->

    <path
      d="M748 111
         C753 86 754 61 744 43"
      stroke-width="5"/>

    <!-- Leaves -->

    <path
      d="
        M744 44
        C757 33 769 32 780 36

        M744 44
