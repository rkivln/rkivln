  />


  <!-- ═══════════════════════════════════════
       TOP LEFT LABEL
  ═══════════════════════════════════════ -->

  <text
    x="28"
    y="27"
    font-family="'Courier New', monospace"
    font-size="9"
    letter-spacing="2"
    fill="#00E5FF">

    RKIVLN // NIGHT DRIVE

  </text>


  <!-- ═══════════════════════════════════════
       MAIN FOOTER TEXT
  ═══════════════════════════════════════ -->

  <text
    x="430"
    y="117"
    text-anchor="middle"
    font-family="'Courier New', monospace"
    font-size="13"
    font-weight="700"
    letter-spacing="3"
    fill="#FFFFFF"
    filter="url(#textGlow)">

    BUILD • SHIP • REPEAT

  </text>


  <!-- ═══════════════════════════════════════
       STATUS
  ═══════════════════════════════════════ -->

  <text
    x="832"
    y="27"
    text-anchor="end"
    font-family="'Courier New', monospace"
    font-size="8"
    letter-spacing="1.5"
    fill="#FF3CAC">

    2026 / ONLINE

  </text>


  <!-- ═══════════════════════════════════════
       MOVING NEON SCAN LINE
  ═══════════════════════════════════════ -->

  <rect
    class="scan"
    x="-70"
    y="97"
    width="70"
    height="1.5"
    fill="#FF3CAC"
  />

</svg>
