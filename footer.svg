    <path
      d="M530 99 L650 140"/>

  </g>


  <!-- ═══════════════════════════════════════
       ROAD CENTER MARKERS
  ═══════════════════════════════════════ -->

  <g
    fill="#F7F7FF"
    class="pulse">

    <path
      d="M425 103
         L435 103
         L440 111
         L420 111
         Z"/>

    <path
      d="M414 118
         L446 118
         L452 128
         L408 128
         Z"/>

    <path
      d="M400 133
         L460 133
         L464 140
         L396 140
