<svg viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .wonder-text { fill: #C9A96E; font-family: sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
    .icon { stroke: #C9A96E; stroke-width: 1; fill: none; opacity: 0.7; }
  </style>
  <!-- 1. Chichen Itza (Frontend) -->
  <g transform="translate(50, 20)">
    <path class="icon" d="M0,40 L40,40 L30,10 L10,10 Z M10,10 L10,0 L30,0 L30,10" />
    <text x="20" y="55" class="wonder-text" text-anchor="middle">Frontend</text>
  </g>
  <!-- 2. Colosseum (Architecture) -->
  <g transform="translate(160, 20)">
    <ellipse class="icon" cx="20" cy="25" rx="20" ry="15" />
    <text x="20" y="55" class="wonder-text" text-anchor="middle">Systems</text>
  </g>
  <!-- 3. Taj Mahal (Design) -->
  <g transform="translate(270, 20)">
    <path class="icon" d="M5,40 L35,40 L35,20 Q20,0 5,20 Z" />
    <text x="20" y="55" class="wonder-text" text-anchor="middle">Design</text>
  </g>
  <!-- 4. Great Wall (Security) -->
  <g transform="translate(380, 20)">
    <path class="icon" d="M0,40 L10,40 L10,20 L20,20 L20,30 L30,30 L30,10 L40,10 L40,40" />
    <text x="20" y="55" class="wonder-text" text-anchor="middle">Security</text>
  </g>
  <!-- 5. Petra (Database) -->
  <g transform="translate(490, 20)">
    <rect class="icon" x="5" y="10" width="30" height="30" />
    <path class="icon" d="M15,40 L15,25 L25,25 L25,40" />
    <text x="20" y="55" class="wonder-text" text-anchor="middle">Storage</text>
  </g>
  <!-- 6. Machu Picchu (Cloud) -->
  <g transform="translate(600, 20)">
    <path class="icon" d="M0,40 L15,10 L25,25 L40,5 L40,40 Z" />
    <text x="20" y="55" class="wonder-text" text-anchor="middle">Cloud</text>
  </g>
  <!-- 7. Christ the Redeemer (API) -->
  <g transform="translate(710, 20)">
    <path class="icon" d="M20,10 L20,40 M5,15 L35,15" />
    <text x="20" y="55" class="wonder-text" text-anchor="middle">APIs</text>
  </g>
</svg>
