<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 120" width="860" height="120">
  <defs>

    <!-- Background -->
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#0A0A15"/>
    </linearGradient>

    <!-- Pokéball gradients -->
    <radialGradient id="r1" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF5555"/>
      <stop offset="100%" stop-color="#CC0000"/>
    </radialGradient>

    <radialGradient id="r2" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="100%" stop-color="#F5C518"/>
    </radialGradient>

    <radialGradient id="r3" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#61DAFB"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </radialGradient>

    <radialGradient id="r4" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </radialGradient>

    <radialGradient id="r5" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </radialGradient>

    <radialGradient id="r6" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF8A3D"/>
      <stop offset="100%" stop-color="#E65100"/>
    </radialGradient>

    <radialGradient id="wh" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CCCCCC"/>
    </radialGradient>


    <!-- Glow filters -->

    <filter id="glowRed">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#FF3333" flood-opacity="0.55" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowYellow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#F5C518" flood-opacity="0.55" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowBlue">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#61DAFB" flood-opacity="0.55" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowGreen">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#4CAF50" flood-opacity="0.55" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPurple">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#A855F7" flood-opacity="0.55" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowOrange">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#FF8A3D" flood-opacity="0.55" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>


    <style>

      /*
        IMPORTANT:
        Positioning is handled by the OUTER groups.
        Animation is handled by INNER groups.
        This prevents GitHub SVG rendering from stacking
        all elements into one position.
      */

      .float1 {
        animation: float1 3s ease-in-out infinite;
      }

      .float2 {
        animation: float2 3.4s ease-in-out infinite 0.4s;
      }

      .float3 {
        animation: float3 3.8s ease-in-out infinite 0.8s;
      }

      .float4 {
        animation: float4 3.2s ease-in-out infinite 1.2s;
      }

      .float5 {
        animation: float5 3.6s ease-in-out infinite 1.6s;
      }

      .float6 {
        animation: float6 3.1s ease-in-out infinite 2s;
      }

      .quote {
        animation: quoteFade 4s ease-in-out infinite;
      }

      .border-pulse {
        animation: borderPulse 3s ease-in-out infinite;
      }

      .spark {
        animation: sparkle 2s ease-in-out infinite;
      }

      @keyframes float1 {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }

      @keyframes float2 {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(5px); }
      }

      @keyframes float3 {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }

      @keyframes float4 {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(4px); }
      }

      @keyframes float5 {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }

      @keyframes float6 {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(5px); }
      }

      @keyframes quoteFade {
        0%,100% { opacity:0.65; }
        50% { opacity:1; }
      }

      @keyframes borderPulse {
        0%,100% {
          stroke:#EE1515;
          stroke-opacity:0.6;
        }

        50% {
          stroke:#FF4444;
          stroke-opacity:1;
        }
      }

      @keyframes sparkle {
        0%,100% {
          opacity:0.3;
          transform:scale(0.8);
        }

        50% {
          opacity:1;
          transform:scale(1.2);
        }
      }

    </style>

  </defs>


  <!-- ========================================================= -->
  <!-- BACKGROUND -->
  <!-- ========================================================= -->

  <rect
    width="860"
    height="120"
    fill="url(#bg4)"
    rx="14"
  />

  <rect
    width="858"
    height="118"
    x="1"
    y="1"
    fill="none"
    stroke="#EE1515"
    stroke-width="1.5"
    rx="13"
    class="border-pulse"
  />


  <!-- ========================================================= -->
  <!-- POKÉMON DECORATIVE LINE -->
  <!-- ========================================================= -->

  <line
    x1="40"
    y1="32"
    x2="820"
    y2="32"
    stroke="#F5C518"
    stroke-width="0.5"
    opacity="0.25"
  />


  <!-- ========================================================= -->
  <!-- POKÉBALL 1 -->
  <!-- ========================================================= -->

  <g transform="translate(45,10)" filter="url(#glowRed)">
    <g class="float1">

      <path
        d="M 0,20 A 20,20 0 0,1 40,20 Z"
        fill="url(#r1)"
      />

      <path
        d="M 0,20 A 20,20 0 0,0 40,20 Z"
        fill="url(#wh)"
      />

      <rect
        x="0"
        y="18"
        width="40"
        height="4"
        fill="#111"
      />

      <circle
        cx="20"
        cy="20"
        r="6"
        fill="#333"
      />

      <circle
        cx="20"
        cy="20"
        r="4"
        fill="url(#wh)"
      />

    </g>
  </g>


  <!-- ========================================================= -->
  <!-- POKÉMON 2 : PIKACHU STYLE -->
  <!-- ========================================================= -->

  <g transform="translate(155,7)" filter="url(#glowYellow)">
    <g class="float2">

      <!-- ears -->
      <path
        d="M12 20 L4 3 L15 9 Z"
        fill="#F5C518"
        stroke="#111"
        stroke-width="1"
      />

      <path
        d="M28 20 L36 3 L25 9 Z"
        fill="#F5C518"
        stroke="#111"
        stroke-width="1"
      />

      <!-- body -->
      <ellipse
        cx="20"
        cy="28"
        rx="13"
        ry="15"
        fill="#F5C518"
        stroke="#111"
        stroke-width="1"
      />

      <!-- cheeks -->
      <circle
        cx="10"
        cy="27"
        r="3"
        fill="#FF4444"
      />

      <circle
        cx="30"
        cy="27"
        r="3"
        fill="#FF4444"
      />

      <!-- eyes -->
      <circle cx="15" cy="22" r="1.8" fill="#111"/>
      <circle cx="25" cy="22" r="1.8" fill="#111"/>

      <!-- tail -->
      <path
        d="M33 35 L40 28 L36 39 L43 43 L34 44"
        fill="#F5C518"
        stroke="#111"
        stroke-width="1"
      />

    </g>
  </g>


  <!-- ========================================================= -->
  <!-- POKÉBALL 3 -->
  <!-- ========================================================= -->

  <g transform="translate(265,10)" filter="url(#glowBlue)">
    <g class="float3">

      <path
        d="M 0,20 A 20,20 0 0,1 40,20 Z"
        fill="url(#r3)"
      />

      <path
        d="M 0,20 A 20,20 0 0,0 40,20 Z"
        fill="url(#wh)"
      />

      <rect
        x="0"
        y="18"
        width="40"
        height="4"
        fill="#111"
      />

      <circle
        cx="20"
        cy="20"
        r="6"
        fill="#333"
      />

      <circle
        cx="20"
        cy="20"
        r="4"
        fill="url(#wh)"
      />

    </g>
  </g>


  <!-- ========================================================= -->
  <!-- POKÉMON 4 : BULBASAUR STYLE -->
  <!-- ========================================================= -->

  <g transform="translate(375,6)" filter="url(#glowGreen)">
    <g class="float4">

      <!-- bulb -->
      <path
        d="M20 3
           C12 5 7 11 9 18
           C10 23 14 25 20 23
           C26 25 30 23 31 18
           C33 11 28 5 20 3Z"
        fill="#4CAF50"
        stroke="#111"
        stroke-width="1"
      />

      <!-- body -->
      <ellipse
        cx="20"
        cy="32"
        rx="15"
        ry="12"
        fill="#4CAF50"
        stroke="#111"
        stroke-width="1"
      />

      <!-- eyes -->
      <circle cx="15" cy="29" r="2" fill="#111"/>
      <circle cx="25" cy="29" r="2" fill="#111"/>

      <!-- legs -->
      <path
        d="M9 38 L5 43"
        stroke="#111"
        stroke-width="2"
        stroke-linecap="round"
      />

      <path
        d="M31 38 L35 43"
        stroke="#111"
        stroke-width="2"
        stroke-linecap="round"
      />

    </g>
  </g>


  <!-- ========================================================= -->
  <!-- POKÉBALL 5 -->
  <!-- ========================================================= -->

  <g transform="translate(485,10)" filter="url(#glowPurple)">
    <g class="float5">

      <path
        d="M 0,20 A 20,20 0 0,1 40,20 Z"
        fill="url(#r5)"
      />

      <path
        d="M 0,20 A 20,20 0 0,0 40,20 Z"
        fill="url(#wh)"
      />

      <rect
        x="0"
        y="18"
        width="40"
        height="4"
        fill="#111"
      />

      <circle
        cx="20"
        cy="20"
        r="6"
        fill="#333"
      />

      <circle
        cx="20"
        cy="20"
        r="4"
        fill="url(#wh)"
      />

    </g>
  </g>


  <!-- ========================================================= -->
  <!-- POKÉMON 6 : CHARMANDER STYLE -->
  <!-- ========================================================= -->

  <g transform="translate(595,7)" filter="url(#glowOrange)">
    <g class="float6">

      <!-- tail -->
      <path
        d="M30 34
           C42 37 42 25 34 22
           C40 25 44 19 39 14
           C45 21 42 35 31 38Z"
        fill="#FF8A3D"
        stroke="#111"
        stroke-width="1"
      />

      <!-- body -->
      <ellipse
        cx="20"
        cy="29"
        rx="12"
        ry="15"
        fill="#FF8A3D"
        stroke="#111"
        stroke-width="1"
      />

      <!-- head -->
      <circle
        cx="20"
        cy="17"
        r="10"
        fill="#FF8A3D"
        stroke="#111"
        stroke-width="1"
      />

      <!-- eyes -->
      <circle cx="16" cy="16" r="1.5" fill="#111"/>
      <circle cx="24" cy="16" r="1.5" fill="#111"/>

      <!-- flame -->
      <path
        d="M20 4
           C16 1 19 -2 22 2
           C26 5 24 8 20 10
           C17 8 17 6 20 4Z"
        fill="#FF4444"
        stroke="#111"
        stroke-width="0.8"
      />

    </g>
  </g>


  <!-- ========================================================= -->
  <!-- POKÉBALL 7 -->
  <!-- ========================================================= -->

  <g transform="translate(705,10)" filter="url(#glowRed)">
    <g class="float1">

      <path
        d="M 0,20 A 20,20 0 0,1 40,20 Z"
        fill="url(#r1)"
      />

      <path
        d="M 0,20 A 20,20 0 0,0 40,20 Z"
        fill="url(#wh)"
      />

      <rect
        x="0"
        y="18"
        width="40"
        height="4"
        fill="#111"
      />

      <circle
        cx="20"
        cy="20"
        r="6"
        fill="#333"
      />

      <circle
        cx="20"
        cy="20"
        r="4"
        fill="url(#wh)"
      />

    </g>
  </g>


  <!-- ========================================================= -->
  <!-- SMALL POKÉMON SPARKLES -->
  <!-- ========================================================= -->

  <text
    x="105"
    y="48"
    font-family="'Courier New',monospace"
    font-size="10"
    fill="#F5C518"
    class="spark"
  >✦</text>

  <text
    x="215"
    y="17"
    font-family="'Courier New',monospace"
    font-size="8"
    fill="#61DAFB"
    class="spark"
  >✦</text>

  <text
    x="325"
    y="49"
    font-family="'Courier New',monospace"
    font-size="9"
    fill="#4CAF50"
    class="spark"
  >✦</text>

  <text
    x="435"
    y="16"
    font-family="'Courier New',monospace"
    font-size="8"
    fill="#A855F7"
    class="spark"
  >✦</text>

  <text
    x="545"
    y="49"
    font-family="'Courier New',monospace"
    font-size="10"
    fill="#F5C518"
    class="spark"
  >✦</text>

  <text
    x="665"
    y="16"
    font-family="'Courier New',monospace"
    font-size="8"
    fill="#FF8A3D"
    class="spark"
  >✦</text>


  <!-- ========================================================= -->
  <!-- FOOTER QUOTE -->
  <!-- ========================================================= -->

  <text
    x="430"
    y="90"
    font-family="'Courier New',monospace"
    font-size="11"
    font-weight="700"
    fill="#F5C518"
    text-anchor="middle"
    letter-spacing="1"
    class="quote"
  >
    ✦ GOTTA BUILD 'EM ALL · RKIVLN · VOLT MEDIA · 2026 ✦
  </text>


  <!-- Bottom decorative line -->

  <line
    x1="40"
    y1="103"
    x2="820"
    y2="103"
    stroke="#F5C518"
    stroke-width="0.5"
    opacity="0.25"
  />

</svg>
