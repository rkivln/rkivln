<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 860 230"
     width="860"
     height="230">

  <defs>

    <!-- VICE CITY NIGHT -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080914"/>
      <stop offset="48%" stop-color="#17132D"/>
      <stop offset="100%" stop-color="#321344"/>
    </linearGradient>

    <!-- CARD GRADIENTS -->
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#092F42"/>
      <stop offset="100%" stop-color="#081722"/>
    </linearGradient>

    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#382050"/>
      <stop offset="100%" stop-color="#170E27"/>
    </linearGradient>

    <linearGradient id="card3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123C36"/>
      <stop offset="100%" stop-color="#0A211E"/>
    </linearGradient>

    <linearGradient id="card4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#48202F"/>
      <stop offset="100%" stop-color="#220D19"/>
    </linearGradient>

    <!-- NEON -->
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#61DAFB"/>
    </linearGradient>

    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF3CAC"/>
      <stop offset="100%" stop-color="#FF72D2"/>
    </linearGradient>

    <!-- GLOWS -->
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
      <feFlood flood-color="#00E5FF" flood-opacity=".35" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="g"/>
      <feMerge>
        <feMergeNode in="g"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
      <feFlood flood-color="#FF3CAC" flood-opacity=".35" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="g"/>
      <feMerge>
        <feMergeNode in="g"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>

      .card1a {
        animation: float1 3.4s ease-in-out infinite;
      }

      .card2a {
        animation: float2 3.8s ease-in-out infinite .4s;
      }

      .card3a {
        animation: float1 3.6s ease-in-out infinite .8s;
      }

      .card4a {
        animation: float2 4s ease-in-out infinite 1.2s;
      }

      .status {
        animation: blink 2s ease-in-out infinite;
      }

      .scan {
        animation: scan 5s linear infinite;
      }

      @keyframes float1 {
        0%,100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-4px);
        }
      }

      @keyframes float2 {
        0%,100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(4px);
        }
      }

      @keyframes blink {
        0%,100% {
          opacity: .45;
        }

        50% {
          opacity: 1;
        }
      }

      @keyframes scan {
        from {
          transform: translateX(-180px);
          opacity: 0;
        }

        15% {
          opacity: .35;
        }

        50% {
          opacity: .7;
        }

        85% {
          opacity: .35;
        }

        to {
          transform: translateX(1000px);
          opacity: 0;
        }
      }

    </style>

  </defs>


